name: Prepare v1.2 status glossary fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.issue.number == 119 && github.event.comment.body == '/fix-v1.2-status-glossary' && github.actor == 'Knapp-Kevin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct glossary and push PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = '| **Shipped** | Built from an immutable prerelease tag and validated as release artifacts, but not promoted as stable. |'
          new = '| **Packaged candidate** | Built from an immutable prerelease tag and validated as release artifacts, but not promoted as stable. |'
          if old not in text:
              raise SystemExit('Expected glossary row not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-v1.2-status-glossary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: restore packaged-candidate status definition'
          git push --force-with-lease origin HEAD:refs/heads/docs/v1.2-status-glossary
