name: Temporary security lockfile refresh

on:
  push:
    branches:
      - hygiene/final-nonmajor-security

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hygiene/final-nonmajor-security

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install current dependency tree
        run: npm ci

      - name: Upgrade Vite within major 7
        run: npm install --save-dev --package-lock-only vite@7.3.6

      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: npm audit fix --package-lock-only || true

      - name: Show remaining high-severity findings
        shell: bash
        run: npm audit --audit-level=high || true

      - name: Remove temporary workflow and commit generated package metadata
        shell: bash
        run: |
          rm .github/workflows/_temporary-security-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/_temporary-security-lockfile.yml
          git diff --cached --stat
          git commit -m "chore(deps): resolve remaining non-major security findings"
          git push origin HEAD:hygiene/final-nonmajor-security
