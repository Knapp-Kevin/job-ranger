name: Create v1.2.0 RC4

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write
  issues: read

jobs:
  create-and-dispatch:
    if: >-
      github.event.issue.number == 119 &&
      github.event.comment.body == '/create-v1.2.0-rc4' &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable RC tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 177e89dc7325bee4787718f89b9c8e2920f28453
          TAG: v1.2.0-rc.4
        run: |
          set -euo pipefail
          tag_json="${RUNNER_TEMP}/tag-ref.json"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >"$tag_json" 2>/dev/null; then
            existing="$(jq -r '.object.sha' "$tag_json")"
            if [[ "$existing" != "$TARGET_SHA" ]]; then
              echo "Refusing to move immutable tag $TAG from $existing to $TARGET_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$TARGET_SHA" >/dev/null
          fi

      - name: Dispatch immutable platform builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0-rc.4
        run: |
          set -euo pipefail
          gh workflow run release-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$TAG" \
            -f platform=all
