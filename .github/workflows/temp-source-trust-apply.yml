name: Temporary Source Trust Applicator

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.issue.number == 126 && github.event.comment.body == '/apply-source-trust'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust

      - name: Repair generator escaping
        run: node scripts/fix-source-trust-generator.mjs

      - name: Apply #117/#118 tranche
        run: node scripts/apply-source-trust-tranche.mjs

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve source truth and acquisition diagnostics"
          git push origin HEAD:release/v1.2.0-source-trust
