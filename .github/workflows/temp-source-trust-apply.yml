name: Temporary Source Trust Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.issue.pull_request && github.event.issue.number == 126 && github.event.comment.body == '/fix-source-trust'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust
      - name: Repair backend diagnostic block
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'electron/src/backend.cts';
          let s = fs.readFileSync(file, 'utf8');
          const oldBlock = `    if (!canRunSourceType(company.sourceType)) {
              const message = \`${'${profile.label}'} was detected, but no reliable extraction path is available yet.\`;
              await this.repository.setCompanyRunState(companyId, "unsupported", startedAt, message);
              return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, "browser-unavailable", message, message);
            }

            if (profile.extractionMode === "browser" && !this.browserPageLoader) {
              const message = "Browser-backed extraction is not available in this environment.";
              await this.repository.setCompanyRunState(companyId, "unsupported", startedAt, message);
              return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, message);
            }`.replace(/^ {12}/gm, '');
          const newBlock = `    if (!canRunSourceType(company.sourceType)) {
              const message = \`${'${profile.label}'} was detected, but no reliable extraction path is available yet.\`;
              await this.repository.setCompanyRunState(companyId, "unsupported", startedAt, message);
              return this.repository.finalizeScrapeRun(
                run.id, "unsupported", 0, 0, "unsupported-source", message, message,
              );
            }

            if (profile.extractionMode === "browser" && !this.browserPageLoader) {
              const message = "Browser-backed extraction is not available in this environment.";
              await this.repository.setCompanyRunState(companyId, "unsupported", startedAt, message);
              return this.repository.finalizeScrapeRun(
                run.id, "unsupported", 0, 0, "browser-unavailable", message, message,
              );
            }`.replace(/^ {12}/gm, '');
          if (!s.includes(newBlock)) {
            if (!s.includes(oldBlock)) throw new Error('Expected backend diagnostic block not found');
            s = s.replace(oldBlock, newBlock);
            fs.writeFileSync(file, s);
          }
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/src/backend.cts
          git commit -m "fix: classify unsupported and browser-unavailable sources distinctly"
          git push origin HEAD:release/v1.2.0-source-trust

  validate:
    if: github.event.issue.pull_request && github.event.issue.number == 126 && github.event.comment.body == '/validate-source-trust'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency/security gate
        run: node scripts/audit-dependencies.mjs
      - name: Explicit unit suite
        run: npm run test:unit
      - name: Repository health
        run: npm run repo:health
      - name: Electron E2E
        run: xvfb-run -a npm run test:e2e
