name: Temporary Source Trust Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.issue.pull_request && github.event.issue.number == 126 && github.event.comment.body == '/fix-source-trust'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust
      - name: Repair backend diagnostic calls
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'electron/src/backend.cts';
          let s = fs.readFileSync(file, 'utf8');
          const unsupportedOld = 'return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, "browser-unavailable", message, message);';
          const unsupportedNew = 'return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, "unsupported-source", message, message);';
          const browserOld = 'return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, message);';
          const browserNew = 'return this.repository.finalizeScrapeRun(run.id, "unsupported", 0, 0, "browser-unavailable", message, message);';
          if (!s.includes(unsupportedOld)) throw new Error('Expected non-runnable source diagnostic call not found');
          if (!s.includes(browserOld)) throw new Error('Expected browser-unavailable diagnostic call not found');
          s = s.replace(unsupportedOld, unsupportedNew);
          s = s.replace(browserOld, browserNew);
          fs.writeFileSync(file, s);
          NODE
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/src/backend.cts
          git commit -m "fix: classify source availability failures explicitly"
          git push origin HEAD:release/v1.2.0-source-trust

  validate:
    if: github.event.issue.pull_request && github.event.issue.number == 126 && github.event.comment.body == '/validate-source-trust'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency/security gate
        run: node scripts/audit-dependencies.mjs
      - name: Explicit unit suite
        run: npm run test:unit
      - name: Repository health
        run: npm run repo:health
      - name: Electron E2E
        run: xvfb-run -a npm run test:e2e
