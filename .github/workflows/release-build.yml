name: Build Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload assets to, for example v1.1.1"
        required: true
        type: string
      platform:
        description: "Which release assets to build"
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - all

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision pinned SQLite CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sqliteUrl = "https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip"
          $expectedSha3 = "88b4659fe747896b853af10157316b4ade143553efb89c1c8ca7423a278dcc8b"
          $archive = Join-Path $env:RUNNER_TEMP "sqlite-tools-win-x64-3530400.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "sqlite-tools-win-x64-3530400"

          Invoke-WebRequest -Uri $sqliteUrl -OutFile $archive
          $actualSha3 = node -e "const fs=require('fs'),crypto=require('crypto'); console.log(crypto.createHash('sha3-256').update(fs.readFileSync(process.argv[1])).digest('hex'))" $archive
          if ($actualSha3.Trim().ToLowerInvariant() -ne $expectedSha3) {
            throw "SQLite archive SHA3-256 mismatch. Expected $expectedSha3 but received $actualSha3."
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir -Force
          $sqlite = Get-ChildItem -Path $extractDir -Recurse -Filter sqlite3.exe | Select-Object -First 1
          if (-not $sqlite) {
            throw "sqlite3.exe was not found in the verified SQLite tools archive."
          }

          New-Item -ItemType Directory -Path build/sqlite -Force | Out-Null
          Copy-Item -LiteralPath $sqlite.FullName -Destination build/sqlite/sqlite3.exe -Force
          $sqlitePath = (Resolve-Path build/sqlite/sqlite3.exe).Path
          "SQLITE3_PATH=$sqlitePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $sqlitePath --version

      - name: Build release artifacts
        run: npm run electron:build:win

      - name: Verify packaged SQLite runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resourcesPath = (Resolve-Path "release/win-unpacked/resources").Path
          $packagedSqlite = Join-Path $resourcesPath "sqlite3.exe"
          if (-not (Test-Path -LiteralPath $packagedSqlite)) {
            throw "Packaged sqlite3.exe is missing from $resourcesPath."
          }
          & $packagedSqlite --version

          Remove-Item Env:SQLITE3_PATH -ErrorAction SilentlyContinue
          $resolved = node -e "process.resourcesPath=process.argv[1]; delete process.env.SQLITE3_PATH; require('./electron/sqlite.cjs').resolveSqliteBinary().then((p)=>process.stdout.write(require('path').resolve(p))).catch((e)=>{console.error(e); process.exit(1);})" $resourcesPath
          $expected = (Resolve-Path $packagedSqlite).Path
          if ($resolved.Trim() -ne $expected) {
            throw "Runtime resolver selected '$resolved' instead of packaged SQLite '$expected'."
          }

      - name: Resolve target tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.release_tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.release_tag.outputs.tag }}" \
              --title "Job Ranger ${{ steps.release_tag.outputs.tag }}" \
              --generate-notes
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" \
            release/Job*windows*.exe \
            release/Job*windows*.exe.blockmap \
            release/latest.yml \
            --clobber

  build-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify system SQLite for release smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/sqlite3
          /usr/bin/sqlite3 --version

      - name: Generate macOS icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/icon.iconset
          sips -z 16 16 public/ICON.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 public/ICON.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 public/ICON.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 public/ICON.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 public/ICON.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 public/ICON.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 public/ICON.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 public/ICON.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 public/ICON.png --out build/icon.iconset/icon_512x512.png
          cp public/ICON.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build release artifacts
        run: npm run electron:build:mac
        env:
          SQLITE3_PATH: /usr/bin/sqlite3
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Resolve target tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ steps.release_tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.release_tag.outputs.tag }}" \
              --title "Job Ranger ${{ steps.release_tag.outputs.tag }}" \
              --generate-notes
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release_tag.outputs.tag }}" \
            release/Job*macos*.dmg \
            release/Job*macos*.zip \
            --clobber
