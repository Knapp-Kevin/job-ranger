name: R1 Resume Import E2E

on:
  push:
    branches:
      - implementation/61-resume-import
    paths:
      - '.github/workflows/r1-resume-import-e2e.yml'
      - 'electron/src/**'
      - 'src/career/evidence.ts'
      - 'src/pages/CareerProfile.tsx'
      - 'src/shared/**'
      - 'tests/e2e/app.spec.ts'

permissions:
  contents: read

jobs:
  electron-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out R1 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron E2E suite
        run: xvfb-run -a npm run test:e2e
