name: R3 Electron Validation

on:
  push:
    branches:
      - implementation/63-deterministic-resume
    paths:
      - '.github/workflows/r3-electron-validation.yml'

permissions:
  contents: read

jobs:
  electron-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install SQLite and display runtime
        run: sudo apt-get update && sudo apt-get install -y sqlite3 xvfb

      - name: Install dependencies
        run: npm ci

      # Rerun deliberately after the R3 Prepare resume handoff assertion changed.
      - name: Run Electron product suite
        run: xvfb-run -a npm run test:e2e
