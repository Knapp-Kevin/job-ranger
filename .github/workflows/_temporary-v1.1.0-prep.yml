name: Temporary v1.1.0 release prep

on:
  push:
    branches:
      - release/v1.1.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Repository health
        run: npm run repo:health

      - name: Electron E2E
        run: xvfb-run -a npm run test:e2e

      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temporary-v1.1.0-prep.yml
          git add package-lock.json .github/workflows/_temporary-v1.1.0-prep.yml
          git commit -m "release: finalize v1.1.0 lockfile validation"
          git push origin HEAD:release/v1.1.0
