name: Apply Source Trust Tranche

# One-shot same-repository PR applicator for #117/#118. The matching workflow
# now exists on the release base, so this synchronization event can execute it.
on:
  pull_request:
    branches:
      - release/v1.2.0-rc1
    paths:
      - scripts/apply-source-trust-tranche.mjs
      - .github/workflows/source-trust-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v1.2.0-source-trust'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-trust branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.2.0-source-trust

      - name: Apply deterministic tranche patch
        run: node scripts/apply-source-trust-tranche.mjs

      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Source-trust tranche already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve source truth and acquisition diagnostics"
          git push origin HEAD:release/v1.2.0-source-trust
