name: Reconcile v1.2.0 publication

on:
  push:
    branches: [main]
    paths:
      - ".release/reconcile-v1.2.0"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'release: trigger v1.2.0 reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.2.0 --jq '.object.sha')" = "71f9b790a1f456321aee2c783f39f4a6784b83a9"
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.2.0 > /tmp/v1.2.0.json
          jq -e '.draft == false and .prerelease == false and .tag_name == "v1.2.0" and (.assets | length) >= 15' /tmp/v1.2.0.json >/dev/null

      - name: Reconcile release documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing expected text for {label}")
              return text.replace(old, new)

          # README
          p = 'README.md'
          t = read(p)
          t = re.sub(
              r'  <a href="https://github\.com/Knapp-Kevin/job-ranger/releases/tag/v1\.1\.2"><img src="https://img\.shields\.io/badge/stable%20release-v1\.1\.2-0f172a\.svg" alt="Stable release v1\.1\.2" /></a>\n  <a href="https://github\.com/Knapp-Kevin/job-ranger/releases/tag/v1\.2\.0-rc\.5"><img src="https://img\.shields\.io/badge/packaged%20candidate-v1\.2\.0--rc\.5-2563eb\.svg" alt="Packaged candidate v1\.2\.0-rc\.5" /></a>',
              '  <a href="https://github.com/Knapp-Kevin/job-ranger/releases/tag/v1.2.0"><img src="https://img.shields.io/badge/stable%20release-v1.2.0-0f172a.svg" alt="Stable release v1.2.0" /></a>',
              t,
          )
          t = re.sub(
              r'\*\*v1\.1\.2 remains the latest stable public release\.\*\*.*?rc\.5 is still a \*\*tester prerelease\*\*, not the stable public release\. Stable v1\.2\.0 is blocked on real Windows signing / macOS Developer ID \+ notarization credentials and clean-machine platform-trust validation, not on repository, package, or release-verifier functionality\.',
              '**v1.2.0 is the current stable public release.** It was published on October 5, 2026 from immutable commit `71f9b790a1f456321aee2c783f39f4a6784b83a9`, promoted byte-for-byte from the fully validated rc.5 artifacts. Windows x64 and macOS x64/arm64 packages, packaged healthcare-operations smoke reports, trust-state evidence, SHA-256 files, and schema-v2 release manifests are published with the release.\n\n**Distribution trust limitation:** v1.2.0 is intentionally unsigned/unnotarized under an explicit owner-approved release exception. Windows SmartScreen / Smart App Control or macOS Gatekeeper may warn or block execution depending on system policy. Do not disable platform security globally. Signed Windows and Developer ID-signed/notarized macOS distribution remains tracked under #125/#130 as a follow-up release.',
              t,
              flags=re.S,
          )
          t = t.replace('**[Download Job Ranger v1.1.2 for Windows x64 (.exe)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-windows-x64.exe)**', '**[Download Job Ranger v1.2.0 for Windows x64 (.exe)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-windows-x64.exe)**')
          t = t.replace('**[Apple Silicon / M-series Mac (.dmg)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-macos-arm64.dmg)**', '**[Apple Silicon / M-series Mac (.dmg)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-macos-arm64.dmg)**')
          t = t.replace('**[Intel Mac (.dmg)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-macos-x64.dmg)**', '**[Intel Mac (.dmg)](https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-macos-x64.dmg)**')
          t = re.sub(
              r'### Testing v1\.2\.0-rc\.5\n\n.*?Job Ranger does not recommend disabling Smart App Control, SmartScreen, Defender, Gatekeeper, or other platform security globally merely to run a tester build\.',
              '### v1.2.0 distribution trust note\n\nv1.2.0 uses the exact rc.5 binaries that passed packaged-runtime smoke and native trust-verifier execution. The release remains unsigned/unnotarized. Verify the platform SHA-256 file and release manifest before use. See [`docs/TESTER_INSTALLATION.md`](./docs/TESTER_INSTALLATION.md), [`docs/DISTRIBUTION_TRUST.md`](./docs/DISTRIBUTION_TRUST.md), and [`docs/CLEAN_MACHINE_TRUST_VALIDATION.md`](./docs/CLEAN_MACHINE_TRUST_VALIDATION.md).\n\nJob Ranger does not recommend disabling Smart App Control, SmartScreen, Defender, Gatekeeper, or other platform security globally. Use only bounded OS-provided per-app/per-file exceptions when available.',
              t,
              flags=re.S,
          )
          t = t.replace('| Capability | Stable v1.1.2 | v1.2.0 candidate |', '| Capability | v1.1.2 | v1.2.0 stable |')
          t = t.replace('**Packaged candidate**', '**Shipped**')
          t = t.replace('The v1.2.0 candidate separates', 'v1.2.0 separates')
          t = t.replace('The v1.2.0 candidate keeps', 'v1.2.0 keeps')
          t = re.sub(
              r'Stable public distribution is fail-closed:\n\n- Windows direct distribution requires configured Azure Artifact Signing and valid Authenticode evidence;\n- macOS direct distribution requires Developer ID signing, notarization, stapling, and platform verification\.\n\nThe repository plumbing, packaged-runtime validation, and clean-machine evidence tooling exist, but actual credential-backed clean-machine evidence is still pending under #125/#130\.',
              'The normal stable-release pipeline remains fail-closed for platform trust: Windows direct distribution expects Azure Artifact Signing and macOS direct distribution expects Developer ID signing/notarization/stapling. v1.2.0 was published under a deliberate owner-approved exception because its rc.5 binaries were already immutable, byte-verified, package-smoke validated, and accompanied by trust/checksum manifests. That exception is documented in the release notes and does not weaken the default policy for future releases. Signed distribution remains tracked under #125/#130.',
              t,
          )
          t = re.sub(
              r'`v1\.2\.0-rc\.5` proves immutable prerelease packaging.*?only then switch README download links and shipped-status documentation from v1\.1\.2 to v1\.2\.0\.',
              '`v1.2.0` is the current stable release and is byte-identical to the validated `v1.2.0-rc.5` package artifacts. The stable tag points to `71f9b790a1f456321aee2c783f39f4a6784b83a9`. Windows/macOS packaged-runtime smoke, native trust-state verification, SHA-256 files, and schema-v2 release manifests are published with the release.\n\nThe outstanding distribution work is now post-release hardening: configure real Windows signing and macOS Developer ID/notarization credentials, collect clean-machine OS trust evidence, and ship a signed follow-up release without mutating v1.2.0 artifacts.',
              t,
              flags=re.S,
          )
          write(p, t)

          # CHANGELOG
          p = 'CHANGELOG.md'
          t = read(p)
          t = re.sub(r'## Unreleased\n\n.*?\n\n## v1\.2\.0 - Release candidate', '## Unreleased\n\nPost-v1.2.0 development is open. Discovery provider tranche #136 is eligible to proceed against the shipped v1.2.0 baseline.\n\n## v1.2.0 - 2026-10-05', t, flags=re.S)
          t = re.sub(r'The current immutable packaged candidate is `v1\.2\.0-rc\.3`.*?v1\.2\.0 is \*\*not\*\* the stable public release until the remaining trust/smoke gates complete\.', 'v1.2.0 is the stable public release. It was promoted from immutable `v1.2.0-rc.5` at `71f9b790a1f456321aee2c783f39f4a6784b83a9`. Windows x64 and macOS x64/arm64 artifacts are byte-identical to the rc.5 packages that passed packaged-runtime healthcare smoke, native trust-verifier execution, SHA-256 verification, and schema-v2 release-manifest generation. The release is intentionally unsigned/unnotarized under an explicit owner-approved exception, with that limitation stated in the release notes.', t, flags=re.S)
          t = t.replace('- Stable exact-semver release builds fail closed when required Windows signing or macOS signing/notarization configuration/verification is absent.', '- Stable exact-semver release builds normally fail closed when required Windows signing or macOS signing/notarization configuration/verification is absent. v1.2.0 is the documented owner-approved exception, promoted byte-for-byte from validated rc.5 artifacts with explicit unsigned-distribution warnings.')
          t = t.replace('- `v1.2.0-rc.3` hosted release run `37239803933` completed successfully for Windows x64 and macOS x64/arm64 with expected package/trust/checksum/manifest assets uploaded.', '- `v1.2.0-rc.3` hosted release run `37239803933` completed successfully for Windows x64 and macOS x64/arm64 with expected package/trust/checksum/manifest assets uploaded.\n- rc.4 added release-blocking packaged-runtime smoke; rc.5 added clean-machine-capable trust verifiers and passed the full native Windows/macOS package pipeline.\n- Stable `v1.2.0` was published on 2026-10-05 from the rc.5 commit with byte-identical artifacts and explicit unsigned/unnotarized distribution disclosure.')
          t = re.sub(r'### Remaining stable-release boundary\n\nBefore stable v1\.2\.0 publication:\n\n.*?\n\n## v1\.1\.2', '### Post-release distribution trust follow-up\n\nStable v1.2.0 is published. Real Windows signing and macOS Developer ID/notarization evidence remain tracked under #125/#130 for a signed follow-up release. v1.2.0 artifacts are immutable and must not be replaced in place.\n\n## v1.1.2', t, flags=re.S)
          write(p, t)

          # SYSTEM_STATE
          p = 'docs/SYSTEM_STATE.md'
          t = read(p)
          t = t.replace('**Published release:** v1.1.2', '**Published release:** v1.2.0')
          t = t.replace('**Selected next release:** v1.2.0', '**Current development line:** post-v1.2.0')
          t = t.replace('**Validated packaged candidate:** v1.2.0-rc.5', '**Shipped release lineage:** v1.2.0 promoted from v1.2.0-rc.5')
          t = t.replace('**Candidate commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '**Release commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`')
          t = re.sub(r'This document is the factual product/repository snapshot\. It intentionally separates the published v1\.1\.2 installers from the much broader v1\.2\.0 candidate\.', 'This document is the factual product/repository snapshot. v1.2.0 is now the published stable release; post-v1.2 development may be ahead of it.', t)
          t = re.sub(r'## Published product: v1\.1\.2\n\n.*?No supported Linux installer is published\.', '## Published product: v1.2.0\n\nv1.2.0 is the latest stable public release for Windows x64 and macOS x64/arm64. It was promoted byte-for-byte from the validated rc.5 lineage and includes the Career Ops expansion, acquisition hardening, packaged-runtime smoke evidence, and release trust/checksum manifests described below.\n\nThe v1.2.0 binaries are intentionally unsigned/unnotarized under an explicit owner-approved exception. Platform warnings or blocks may still occur. Signed distribution remains a post-release follow-up under #125/#130.\n\nNo supported Linux installer is published.', t, flags=re.S)
          t = t.replace('## v1.2.0 candidate', '## v1.2.0 shipped capabilities')
          t = re.sub(r'### Stable public tags\n\nExact stable tags matching `vMAJOR\.MINOR\.PATCH` fail closed unless platform trust configuration is present and verification succeeds\.', '### Stable public tags\n\nThe normal stable-tag pipeline fails closed unless platform trust configuration is present and verification succeeds. v1.2.0 is the explicit owner-approved exception: it was promoted from byte-identical validated rc.5 artifacts with published trust-state evidence, SHA-256 manifests, and release-note disclosure. Future releases remain fail-closed by default.', t)
          t = t.replace('## Validated packaged candidate: v1.2.0-rc.5', '## Shipped v1.2.0 release evidence')
          t = t.replace('`v1.2.0-rc.5` → `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '`v1.2.0` → `71f9b790a1f456321aee2c783f39f4a6784b83a9` (promoted byte-for-byte from `v1.2.0-rc.5`)')
          t = t.replace('### Windows rc.5 evidence', '### Windows v1.2.0 / rc.5 evidence')
          t = t.replace('### macOS rc.5 evidence', '### macOS v1.2.0 / rc.5 evidence')
          t = re.sub(r'The GitHub Release is marked `prerelease: true`\. v1\.1\.2 remains the stable release\.', 'The `v1.2.0` GitHub Release is non-prerelease and is the current latest stable release. Its package assets are byte-identical to rc.5.', t)
          t = t.replace('The rc.5 packaged smoke uses', 'The v1.2.0 packaged smoke uses')
          t = re.sub(r'## Remaining stable-release gates\n\nRepository implementation.*?Hosted packaged-runtime smoke has already passed and is not the remaining blocker\.', '## Post-release distribution-trust follow-up\n\nRepository implementation, migration validation, immutable packaging, packaged-runtime smoke, and stable v1.2.0 publication are complete.\n\nStill tracked under #125/#130 for a signed follow-up release:\n\n1. actual Azure Artifact Signing credentials and signed Windows evidence;\n2. clean supported Windows 11 install/launch evidence, including SmartScreen / Smart App Control behavior;\n3. actual Apple Developer ID credentials and signed/notarized/stapled macOS evidence;\n4. clean supported macOS Gatekeeper launch evidence.\n\nv1.2.0 artifacts are immutable and will not be replaced in place. The connected Desktop Commander runner is currently offline, so clean-machine Windows observation cannot be executed from this session.', t, flags=re.S)
          write(p, t)

          # RELEASE_READINESS
          p = 'docs/RELEASE_READINESS.md'
          t = read(p)
          t = t.replace('The current published stable release is **v1.1.2**. The current validated packaged candidate is **v1.2.0-rc.5**. It must not be represented as the stable shipped release until the remaining public-trust gates complete.', 'The current published stable release is **v1.2.0**, promoted from the validated `v1.2.0-rc.5` lineage at `71f9b790a1f456321aee2c783f39f4a6784b83a9`. v1.2.0 is an explicit owner-approved unsigned/unnotarized exception; future stable releases remain subject to the normal platform-signing gates by default.')
          t = t.replace('- [ ] A stable public release carries valid Authenticode signatures and records observed SmartScreen / Smart App Control behavior on a clean supported machine.', '- [ ] By default, a stable public release carries valid Authenticode signatures and records observed SmartScreen / Smart App Control behavior on a clean supported machine. Any unsigned exception must be explicit, owner-approved, byte-identical to a validated candidate, disclosed in release notes, and tracked for signed follow-up.')
          t = t.replace('- [ ] A stable public release is Developer ID signed, notarized, stapled, and passes `codesign`, `spctl`, and stapler verification.', '- [ ] By default, a stable public release is Developer ID signed, notarized, stapled, and passes `codesign`, `spctl`, and stapler verification. Any unsigned exception must meet the same explicit owner-approval, immutable-candidate, disclosure, and follow-up requirements.')
          t = re.sub(r'## Current v1\.2\.0 release-readiness status\n\n.*\Z', '## Current v1.2.0 release-readiness status\n\n**Published:** `v1.2.0` → `71f9b790a1f456321aee2c783f39f4a6784b83a9` on 2026-10-05.\n\nThe release is non-prerelease and is GitHub\'s current latest release. Its Windows/macOS assets are byte-identical to the validated rc.5 packages, with packaged healthcare-operations smoke reports, native trust-state evidence, SHA-256 files, and schema-v2 release manifests.\n\nv1.2.0 was published under an explicit owner-approved unsigned/unnotarized exception. This is not a silent weakening of the default release contract. Signed Windows and Developer ID/notarized macOS distribution remains post-release work under #125/#130 and should ship as a new release rather than mutating v1.2.0 artifacts.\n', t, flags=re.S)
          write(p, t)

          # Candidate evidence document becomes release provenance.
          p = 'docs/validation/RELEASE_CANDIDATE_V1.2.0.md'
          t = read(p)
          t = t.replace('**Status:** packaged prerelease candidate validated; signed public trust evidence pending', '**Status:** stable v1.2.0 published; signed platform-trust follow-up pending')
          t = t.replace('**Validated packaged candidate:** v1.2.0-rc.5', '**Published release:** v1.2.0 (promoted from v1.2.0-rc.5)')
          t = t.replace('**Candidate commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '**Release commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`')
          t = re.sub(r'## Remaining release gates\n\nRepository implementation.*?That is now distinct from packaged-runtime smoke, which has passed\.', '## Post-release distribution trust follow-up\n\nStable v1.2.0 is published. Real Windows signing and macOS Developer ID/notarization clean-machine evidence remains tracked under #125/#130 for a signed follow-up release. The v1.2.0 artifacts are immutable and must not be replaced in place.\n\nThe connected Desktop Commander Windows runner is currently offline, so clean-machine Windows trust observation cannot be executed from this session. Packaged-runtime smoke and stable publication are complete.', t, flags=re.S)
          t = re.sub(r'## Publication boundary\n\nUntil the stable trust gates complete:\n\n- v1\.1\.2 remains the latest stable shipped release;\n- v1\.2\.0-rc\.5 is the validated tester prerelease, not the stable public release;\n- stable README download links remain on v1\.1\.2;\n- unsigned prerelease installation guidance does not substitute for public platform signing/notarization\.', '## Publication boundary\n\nv1.2.0 is the latest stable shipped release and is GitHub\'s current latest release. It is byte-identical to rc.5 and intentionally unsigned/unnotarized under an explicit owner-approved exception. README download links now point to v1.2.0. Signed platform-trust distribution remains a follow-up release rather than an in-place mutation of v1.2.0.', t)
          write(p, t)

          # Remove temporary release machinery from the repository.
          for temp in [
              '.github/workflows/publish-v1.2.0-unsigned.yml',
              '.release/publish-v1.2.0-unsigned',
              '.github/workflows/reconcile-v1.2.0-release.yml',
              '.release/reconcile-v1.2.0',
          ]:
              path = Path(temp)
              if path.exists():
                  path.unlink()
          PY

      - name: Verify documentation transition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'stable%20release-v1.2.0' README.md
          grep -q 'Download Job Ranger v1.2.0 for Windows' README.md
          grep -q 'Published release:\*\* v1.2.0' docs/SYSTEM_STATE.md
          grep -q '^## v1.2.0 - 2026-10-05$' CHANGELOG.md
          grep -q 'Published:.*v1.2.0' docs/RELEASE_READINESS.md
          ! grep -q 'v1.1.2 remains the latest stable public release' README.md
          ! grep -q 'Before stable v1.2.0' README.md

      - name: Commit post-release reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'docs: mark v1.2.0 shipped and open post-release line'
          git push origin HEAD:main
