name: R1 Anydoc Package Proof

on:
  push:
    branches:
      - implementation/61-resume-import
    paths:
      - '.github/workflows/r1-anydoc-package-proof.yml'

permissions:
  contents: read

jobs:
  linux-package-proof:
    # One-shot product incorporation proof. Remove after the delta is recorded.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/61-resume-import

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install fixture dependencies
        run: pip install -r tests/fixtures/career-evidence/parser-benchmark/requirements.txt

      - name: Generate synthetic document fixtures
        run: python scripts/generate-resume-parser-fixtures.py

      - name: Build renderer and Electron runtime
        run: npm run build && npm run desktop:compile

      - name: Package candidate with Anydoc
        run: npx electron-builder --dir --publish never --config.directories.output=release-anydoc

      - name: Prove Anydoc executes from packaged app.asar
        run: node scripts/verify-packaged-anydoc.mjs release-anydoc/linux-unpacked tests/fixtures/career-evidence/parser-benchmark/generated/hvac-technician.docx

      - name: Package same build without Anydoc dependency
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete packageJson.dependencies['@firecrawl/anydoc'];
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
          npm uninstall @firecrawl/anydoc --ignore-scripts --no-save
          npx electron-builder --dir --publish never --config.directories.output=release-baseline

      - name: Measure physical packaged resource delta
        shell: bash
        run: |
          candidate=$(du -sb release-anydoc/linux-unpacked/resources | cut -f1)
          baseline=$(du -sb release-baseline/linux-unpacked/resources | cut -f1)
          delta=$((candidate - baseline))
          echo "ANYDOC_CANDIDATE_RESOURCE_BYTES=$candidate"
          echo "ANYDOC_BASELINE_RESOURCE_BYTES=$baseline"
          echo "ANYDOC_PACKAGED_DELTA_BYTES=$delta"
          python - <<PY
          delta = $delta
          print(f'ANYDOC_PACKAGED_DELTA_MIB={delta / 1024 / 1024:.3f}')
          PY

      - name: Show physical unpacked native payload
        shell: bash
        run: |
          if [ -d release-anydoc/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl ]; then
            find release-anydoc/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl -type f -printf '%s %p\n' | sort -n
            du -sb release-anydoc/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl
          fi
