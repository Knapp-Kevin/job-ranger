name: Electron E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/r4-electron-validation.yml'
  push:
    branches:
      - implementation/64-deterministic-tailoring
    paths:
      - 'electron/**'
      - 'src/**'
      - 'tests/e2e/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/r4-electron-validation.yml'

permissions:
  contents: read

jobs:
  electron-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron E2E suite
        run: xvfb-run -a npm run test:e2e
