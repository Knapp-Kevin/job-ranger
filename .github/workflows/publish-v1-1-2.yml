name: Publish v1.1.2

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          target="e58dc12c6be8186b9f674f7389bc1814562eede0"
          version=$(git show "$target:package.json" | node -e "let d=''; process.stdin.on('data',c=>d+=c); process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          test "$version" = "1.1.2"
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.2 >/dev/null 2>&1; then
            echo "v1.1.2 already exists; refusing to move an immutable release tag."
            exit 1
          fi

      - name: Create immutable v1.1.2 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.1.2 e58dc12c6be8186b9f674f7389bc1814562eede0 -m "Job Ranger v1.1.2"
          git push origin refs/tags/v1.1.2

      - name: Create GitHub release and dispatch platform builders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.1.2 \
            --title "Job Ranger v1.1.2" \
            --generate-notes
          gh workflow run release-build.yml \
            --ref v1.1.2 \
            -f tag=v1.1.2 \
            -f platform=all
