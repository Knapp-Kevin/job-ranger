name: Prepare v1.1.2

on:
  push:
    branches:
      - "release/v1.1.2"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize package version
        run: npm version 1.1.2 --no-git-tag-version

      - name: Update release documentation
        run: python scripts/prepare-v1.1.2.py

      - name: Validate release-prep tree
        run: |
          npm run repo:health
          xvfb-run -a npm run test:e2e

      - name: Commit synchronized release prep
        run: |
          set -euo pipefail
          git rm .github/workflows/v1-1-2-prep.yml scripts/prepare-v1.1.2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md HELP.md CHANGELOG.md docs/SYSTEM_STATE.md
          git commit -m "release: prepare v1.1.2"
          git push origin HEAD:release/v1.1.2
