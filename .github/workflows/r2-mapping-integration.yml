name: R2 Mapping Integration

on:
  push:
    branches:
      - implementation/62-requirement-evidence
    paths:
      - '.github/workflows/r2-mapping-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out R2 branch
        uses: actions/checkout@v4
        with:
          ref: implementation/62-requirement-evidence

      - name: Apply deterministic integration edits
        run: node scripts/apply-r2-mapping-integration.mjs

      - name: Remove temporary integration scaffold
        run: rm scripts/apply-r2-mapping-integration.mjs .github/workflows/r2-mapping-integration.yml

      - name: Commit R2 mapping integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire deterministic requirement evidence mapping'
          git push origin HEAD:implementation/62-requirement-evidence
