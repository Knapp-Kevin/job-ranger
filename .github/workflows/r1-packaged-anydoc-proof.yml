name: R1 Packaged Anydoc Proof

on:
  push:
    branches:
      - implementation/61-resume-import
    paths:
      - '.github/workflows/r1-packaged-anydoc-proof.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-packaged-anydoc.cjs'

permissions:
  contents: read

jobs:
  packaged-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out R1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install branch dependencies
        run: npm ci

      - name: Install fixture-generation dependencies
        run: pip install -r tests/fixtures/career-evidence/parser-benchmark/requirements.txt

      - name: Generate synthetic resume fixtures
        run: python scripts/generate-resume-parser-fixtures.py

      - name: Build branch package directory
        run: npm run build && npm run desktop:compile && npx electron-builder --linux --dir --publish never

      - name: Verify packaged Anydoc runtime
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/job-ranger \
            scripts/verify-packaged-anydoc.cjs \
            release/linux-unpacked/resources/app.asar \
            tests/fixtures/career-evidence/parser-benchmark/generated/operations.pdf

      - name: Measure R1 package
        shell: bash
        run: |
          branch_bytes=$(du -sb release/linux-unpacked | cut -f1)
          asar_bytes=$(stat -c%s release/linux-unpacked/resources/app.asar)
          echo "BRANCH_BYTES=$branch_bytes" >> "$GITHUB_ENV"
          echo "BRANCH_ASAR_BYTES=$asar_bytes" >> "$GITHUB_ENV"
          echo "R1 unpacked bytes: $branch_bytes"
          echo "R1 app.asar bytes: $asar_bytes"

      - name: Build main baseline in worktree
        shell: bash
        run: |
          git worktree add ../job-ranger-main origin/main
          cd ../job-ranger-main
          npm ci
          npm run build
          npm run desktop:compile
          npx electron-builder --linux --dir --publish never

      - name: Report actual package delta
        shell: bash
        run: |
          main_bytes=$(du -sb ../job-ranger-main/release/linux-unpacked | cut -f1)
          main_asar_bytes=$(stat -c%s ../job-ranger-main/release/linux-unpacked/resources/app.asar)
          delta=$((BRANCH_BYTES - main_bytes))
          asar_delta=$((BRANCH_ASAR_BYTES - main_asar_bytes))
          python - <<PY
          import json
          result = {
              'mainUnpackedBytes': int('$main_bytes'),
              'r1UnpackedBytes': int('$BRANCH_BYTES'),
              'unpackedDeltaBytes': int('$delta'),
              'mainAsarBytes': int('$main_asar_bytes'),
              'r1AsarBytes': int('$BRANCH_ASAR_BYTES'),
              'asarDeltaBytes': int('$asar_delta'),
          }
          print(json.dumps(result, indent=2))
          with open('r1-packaged-anydoc-proof.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, indent=2)
          PY

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: r1-packaged-anydoc-proof
          path: r1-packaged-anydoc-proof.json
          if-no-files-found: error
