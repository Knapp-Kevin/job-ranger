name: R1 Packaged Anydoc Proof

on:
  push:
    branches:
      - implementation/61-resume-import
    paths:
      - '.github/workflows/r1-packaged-anydoc-proof.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/src/**'
      - 'src/career/evidence.ts'
      - 'src/pages/CareerProfile.tsx'
      - 'src/shared/**'
      - 'scripts/verify-packaged-anydoc.cjs'
      - 'tests/resume-import-smoke-test.cjs'

permissions:
  contents: read

jobs:
  packaged-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out R1 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install fixture-generation dependencies
        run: pip install -r tests/fixtures/career-evidence/parser-benchmark/requirements.txt

      - name: Generate synthetic resume fixtures
        run: python scripts/generate-resume-parser-fixtures.py

      - name: Run repository health
        run: npm run repo:health

      - name: Package R1 application
        run: npx electron-builder --linux --dir --publish never

      - name: Verify packaged Anydoc runtime
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/job-ranger \
            scripts/verify-packaged-anydoc.cjs \
            release/linux-unpacked/resources/app.asar \
            tests/fixtures/career-evidence/parser-benchmark/generated/operations-history.pdf

      - name: Report packaged parser payload
        shell: bash
        run: |
          du -sb release/linux-unpacked/resources
          if [ -d release/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl ]; then
            du -sb release/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl
            find release/linux-unpacked/resources/app.asar.unpacked/node_modules/@firecrawl -type f -printf '%s %p\n' | sort -n
          fi
