name: Publish Job Ranger v1.1.0 once

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.repository == 'Knapp-Kevin/job-ranger'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "1.1.0"

      - name: Create v1.1.0 release at this main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists; refusing to move or recreate the release."
            exit 1
          fi
          gh release create v1.1.0 \
            --target "$GITHUB_SHA" \
            --title "Job Ranger v1.1.0" \
            --generate-notes \
            --latest

      - name: Dispatch Windows and macOS release builders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-build.yml \
            --ref v1.1.0 \
            -f tag=v1.1.0 \
            -f platform=all

      - name: Remove one-time publisher from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_release-v1.1.0-once.yml
          git add .github/workflows/_release-v1.1.0-once.yml
          git commit -m "chore: remove one-time v1.1.0 release publisher"
          git push origin HEAD:main
