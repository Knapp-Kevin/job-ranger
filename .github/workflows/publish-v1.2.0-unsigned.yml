name: Publish v1.2.0 unsigned stable

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  promote:
    if: github.event.issue.number == 119 && github.event.comment.body == '/publish-v1.2.0-unsigned' && github.actor == 'Knapp-Kevin'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RC_TAG: v1.2.0-rc.5
      STABLE_TAG: v1.2.0
      TARGET_SHA: 71f9b790a1f456321aee2c783f39f4a6784b83a9
    steps:
      - name: Verify approved rc.5 lineage
        shell: bash
        run: |
          set -euo pipefail
          rc_sha="$(gh api "repos/$REPO/git/ref/tags/$RC_TAG" --jq '.object.sha')"
          test "$rc_sha" = "$TARGET_SHA" || { echo "rc.5 moved: $rc_sha" >&2; exit 1; }

      - name: Create immutable stable tag if absent
        shell: bash
        run: |
          set -euo pipefail
          if stable_json="$(gh api "repos/$REPO/git/ref/tags/$STABLE_TAG" 2>/dev/null)"; then
            stable_sha="$(printf '%s' "$stable_json" | jq -r '.object.sha')"
            test "$stable_sha" = "$TARGET_SHA" || { echo "Refusing to move existing $STABLE_TAG from $stable_sha" >&2; exit 1; }
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$STABLE_TAG" -f sha="$TARGET_SHA" >/dev/null
          fi

      - name: Download rc.5 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promote
          gh release download "$RC_TAG" --repo "$REPO" --dir promote
          gh api "repos/$REPO/releases/tags/$RC_TAG" > rc-release.json

      - name: Verify downloaded asset digests and inventory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const release = JSON.parse(fs.readFileSync('rc-release.json', 'utf8'));
          const required = new Set([
            'Job.Ranger-v1.2.0-windows-x64.exe',
            'Job.Ranger-v1.2.0-windows-x64.exe.blockmap',
            'latest.yml',
            'windows-package-smoke.json',
            'windows-signing.json',
            'windows-SHA256SUMS.txt',
            'windows-release-manifest.json',
            'Job.Ranger-v1.2.0-macos-arm64.dmg',
            'Job.Ranger-v1.2.0-macos-arm64.zip',
            'Job.Ranger-v1.2.0-macos-x64.dmg',
            'Job.Ranger-v1.2.0-macos-x64.zip',
            'macos-package-smoke.json',
            'macos-signing.txt',
            'macos-SHA256SUMS.txt',
            'macos-release-manifest.json'
          ]);
          const byName = new Map(release.assets.map(a => [a.name, a]));
          for (const name of required) {
            const asset = byName.get(name);
            if (!asset) throw new Error(`Missing required rc.5 asset: ${name}`);
            const file = path.join('promote', name);
            if (!fs.existsSync(file)) throw new Error(`Downloaded asset missing: ${name}`);
            if (!asset.digest || !asset.digest.startsWith('sha256:')) throw new Error(`No SHA-256 digest from GitHub for ${name}`);
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const expected = asset.digest.slice('sha256:'.length);
            if (actual !== expected) throw new Error(`Digest mismatch for ${name}: ${actual} != ${expected}`);
          }
          console.log(`Verified ${required.size} required rc.5 assets byte-for-byte.`);
          NODE

      - name: Publish stable v1.2.0 release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$STABLE_TAG release already exists; refusing to replace it." >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## Job Ranger v1.2.0

          v1.2.0 is the stable product release promoted from the fully validated `v1.2.0-rc.5` executable lineage.

          The Windows x64 and macOS x64/arm64 packages are byte-identical to the rc.5 artifacts that passed repository validation, packaged-runtime healthcare-operations smoke, platform trust-state verification, and SHA-256 manifest verification.

          ### Important distribution note

          These v1.2.0 installers are **not yet code-signed/notarized for normal platform trust**. The release includes trust reports and SHA-256 manifests so users can verify exactly what was published, but Windows SmartScreen / Smart App Control or macOS Gatekeeper may warn or block execution depending on system policy.

          Job Ranger does not recommend disabling operating-system security globally. On macOS, use the OS-provided per-app **Privacy & Security → Open Anyway** path when offered. On Windows, use only an OS-provided per-file/per-app override when available; if Smart App Control does not offer a safe exception, this unsigned build is not supported on that configuration.

          Signed Windows and Developer ID-signed/notarized macOS distribution remains tracked separately and will ship as a follow-up release rather than mutating these v1.2.0 artifacts.

          ### Validation evidence included

          - Windows/macOS packaged consumer smoke reports
          - platform trust-state reports
          - SHA-256 checksum files
          - schema-v2 release manifests

          Source and release tag: `v1.2.0` → `71f9b790a1f456321aee2c783f39f4a6784b83a9`
          EOF
          gh release create "$STABLE_TAG" promote/* --repo "$REPO" --title "Job Ranger v1.2.0" --notes-file release-notes.md --latest --verify-tag

      - name: Verify stable release publication
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/$STABLE_TAG" > stable-release.json
          jq -e '.draft == false and .prerelease == false and .tag_name == "v1.2.0"' stable-release.json >/dev/null
          count="$(jq '.assets | length' stable-release.json)"
          test "$count" -ge 15 || { echo "Stable release asset inventory incomplete: $count" >&2; exit 1; }
          stable_sha="$(gh api "repos/$REPO/git/ref/tags/$STABLE_TAG" --jq '.object.sha')"
          test "$stable_sha" = "$TARGET_SHA"

      - name: Record publication on release issue
        shell: bash
        run: |
          gh issue comment 119 --repo "$REPO" --body "Published **v1.2.0** from the validated rc.5 lineage at \`$TARGET_SHA\`. The stable release is non-prerelease and carries the byte-identical rc.5 Windows/macOS artifacts plus package-smoke, trust-state, checksum, and manifest evidence. Distribution is explicitly unsigned/unnotarized in v1.2.0; signed platform-trust follow-up remains under #125/#130."
