name: Retry v1.2.0 publication reconciliation

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.issue.number == 119 && github.event.comment.body == '/reconcile-v1.2.0-retry' && github.actor == 'Knapp-Kevin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.2.0 --jq '.object.sha')" = "71f9b790a1f456321aee2c783f39f4a6784b83a9"
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.2.0 > /tmp/release.json
          jq -e '.draft == false and .prerelease == false and (.assets | length) >= 15' /tmp/release.json >/dev/null

      - name: Reuse verified reconciliation transform
        shell: bash
        run: |
          set -euo pipefail
          awk '/^[[:space:]]+python3 <<'\''PY'\''$/{capture=1;next} capture && /^[[:space:]]+PY$/{exit} capture{sub(/^[[:space:]]{10}/,""); print}' .github/workflows/reconcile-v1.2.0-release-comment.yml > /tmp/reconcile.py
          test -s /tmp/reconcile.py
          python3 /tmp/reconcile.py

      - name: Remove temporary release machinery
        run: |
          rm -f .github/workflows/publish-v1.2.0-unsigned.yml
          rm -f .github/workflows/reconcile-v1.2.0-release.yml
          rm -f .github/workflows/reconcile-v1.2.0-release-comment.yml
          rm -f .github/workflows/reconcile-v1.2.0-retry.yml
          rm -f .release/publish-v1.2.0-unsigned
          rm -f .release/reconcile-v1.2.0

      - name: Normalize metadata whitespace, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' docs/SYSTEM_STATE.md docs/validation/RELEASE_CANDIDATE_V1.2.0.md
          grep -q 'stable%20release-v1.2.0' README.md
          grep -q 'Download Job Ranger v1.2.0 for Windows' README.md
          grep -q '^## v1.2.0 - 2026-10-05$' CHANGELOG.md
          grep -q 'Published release:\*\* v1.2.0' docs/SYSTEM_STATE.md
          grep -q 'Published:.*v1.2.0' docs/RELEASE_READINESS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: mark v1.2.0 shipped and open post-release line'
          git push origin HEAD:main
