name: Reconcile v1.2.0 publication from issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.issue.number == 119 && github.event.comment.body == '/reconcile-v1.2.0' && github.actor == 'Knapp-Kevin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.2.0 --jq '.object.sha')" = "71f9b790a1f456321aee2c783f39f4a6784b83a9"
          gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.2.0 > /tmp/release.json
          jq -e '.draft == false and .prerelease == false and (.assets | length) >= 15' /tmp/release.json >/dev/null

      - name: Update release truth docs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  print(f'warning: no change in {path}')
              p.write_text(new)

          def readme(t):
              t = re.sub(r'  <a href="https://github\.com/Knapp-Kevin/job-ranger/releases/tag/v1\.1\.2">.*?</a>\n  <a href="https://github\.com/Knapp-Kevin/job-ranger/releases/tag/v1\.2\.0-rc\.5">.*?</a>', '  <a href="https://github.com/Knapp-Kevin/job-ranger/releases/tag/v1.2.0"><img src="https://img.shields.io/badge/stable%20release-v1.2.0-0f172a.svg" alt="Stable release v1.2.0" /></a>', t)
              t = re.sub(r'\*\*v1\.1\.2 remains the latest stable public release\.\*\*.*?rc\.5 is still a \*\*tester prerelease\*\*, not the stable public release\. Stable v1\.2\.0 is blocked on real Windows signing / macOS Developer ID \+ notarization credentials and clean-machine platform-trust validation, not on repository, package, or release-verifier functionality\.', '**v1.2.0 is the current stable public release.** It was published on October 5, 2026 from immutable commit `71f9b790a1f456321aee2c783f39f4a6784b83a9`, promoted byte-for-byte from the validated rc.5 artifacts. Windows x64 and macOS x64/arm64 packages, packaged healthcare-operations smoke reports, trust-state evidence, SHA-256 files, and schema-v2 release manifests are published with the release.\n\n**Distribution trust limitation:** v1.2.0 is intentionally unsigned/unnotarized under an explicit owner-approved exception. Windows SmartScreen / Smart App Control or macOS Gatekeeper may warn or block execution depending on system policy. Do not disable platform security globally. Signed distribution remains tracked under #125/#130 as a follow-up release.', t, flags=re.S)
              t = t.replace('https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-windows-x64.exe', 'https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-windows-x64.exe').replace('Download Job Ranger v1.1.2 for Windows', 'Download Job Ranger v1.2.0 for Windows')
              t = t.replace('https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-macos-arm64.dmg', 'https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-macos-arm64.dmg')
              t = t.replace('https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.1.2/Job.Ranger-v1.1.2-macos-x64.dmg', 'https://github.com/Knapp-Kevin/job-ranger/releases/download/v1.2.0/Job.Ranger-v1.2.0-macos-x64.dmg')
              t = re.sub(r'### Testing v1\.2\.0-rc\.5\n\n.*?Job Ranger does not recommend disabling Smart App Control, SmartScreen, Defender, Gatekeeper, or other platform security globally merely to run a tester build\.', '### v1.2.0 distribution trust note\n\nv1.2.0 uses the exact rc.5 binaries that passed packaged-runtime smoke and native trust-verifier execution. The release remains unsigned/unnotarized. Verify the platform SHA-256 file and release manifest before use. See [`docs/TESTER_INSTALLATION.md`](./docs/TESTER_INSTALLATION.md), [`docs/DISTRIBUTION_TRUST.md`](./docs/DISTRIBUTION_TRUST.md), and [`docs/CLEAN_MACHINE_TRUST_VALIDATION.md`](./docs/CLEAN_MACHINE_TRUST_VALIDATION.md).\n\nJob Ranger does not recommend disabling Smart App Control, SmartScreen, Defender, Gatekeeper, or other platform security globally. Use only bounded OS-provided per-app/per-file exceptions when available.', t, flags=re.S)
              t = t.replace('| Capability | Stable v1.1.2 | v1.2.0 candidate |', '| Capability | v1.1.2 | v1.2.0 stable |').replace('**Packaged candidate**', '**Shipped**')
              t = t.replace('The v1.2.0 candidate separates', 'v1.2.0 separates').replace('The v1.2.0 candidate keeps', 'v1.2.0 keeps')
              t = re.sub(r'Stable public distribution is fail-closed:\n\n- Windows direct distribution requires configured Azure Artifact Signing and valid Authenticode evidence;\n- macOS direct distribution requires Developer ID signing, notarization, stapling, and platform verification\.\n\nThe repository plumbing, packaged-runtime validation, and clean-machine evidence tooling exist, but actual credential-backed clean-machine evidence is still pending under #125/#130\.', 'The normal stable-release pipeline remains fail-closed for platform trust. v1.2.0 is the documented owner-approved exception because its rc.5 binaries were immutable, byte-verified, package-smoke validated, and accompanied by trust/checksum manifests. Signed distribution remains tracked under #125/#130; future normal releases remain fail-closed by default.', t)
              t = re.sub(r'`v1\.2\.0-rc\.5` proves immutable prerelease packaging.*?only then switch README download links and shipped-status documentation from v1\.1\.2 to v1\.2\.0\.', '`v1.2.0` is the current stable release and is byte-identical to the validated rc.5 package artifacts at `71f9b790a1f456321aee2c783f39f4a6784b83a9`. The outstanding distribution work is post-release hardening: configure real Windows signing and macOS Developer ID/notarization credentials, collect clean-machine trust evidence, and ship a signed follow-up without mutating v1.2.0 artifacts.', t, flags=re.S)
              return t

          def changelog(t):
              t = re.sub(r'## Unreleased\n\n.*?\n\n## v1\.2\.0 - Release candidate', '## Unreleased\n\nPost-v1.2.0 development is open. Discovery provider tranche #136 may proceed against the shipped v1.2.0 baseline.\n\n## v1.2.0 - 2026-10-05', t, flags=re.S)
              t = re.sub(r'The current immutable packaged candidate is `v1\.2\.0-rc\.3`.*?v1\.2\.0 is \*\*not\*\* the stable public release until the remaining trust/smoke gates complete\.', 'v1.2.0 is the stable public release, promoted from immutable `v1.2.0-rc.5` at `71f9b790a1f456321aee2c783f39f4a6784b83a9`. The Windows/macOS artifacts are byte-identical to the rc.5 packages that passed packaged-runtime smoke, native trust-verifier execution, SHA-256 verification, and schema-v2 release-manifest generation. The release is intentionally unsigned/unnotarized under an explicit owner-approved exception.', t, flags=re.S)
              t = t.replace('- Stable exact-semver release builds fail closed when required Windows signing or macOS signing/notarization configuration/verification is absent.', '- Stable exact-semver release builds normally fail closed when required Windows signing or macOS signing/notarization configuration/verification is absent. v1.2.0 is the documented owner-approved exception, promoted byte-for-byte from validated rc.5 artifacts with explicit unsigned-distribution warnings.')
              t = re.sub(r'### Remaining stable-release boundary\n\nBefore stable v1\.2\.0 publication:\n\n.*?\n\n## v1\.1\.2', '### Post-release distribution trust follow-up\n\nStable v1.2.0 is published. Real Windows signing and macOS Developer ID/notarization evidence remain tracked under #125/#130 for a signed follow-up release. v1.2.0 artifacts are immutable and must not be replaced in place.\n\n## v1.1.2', t, flags=re.S)
              return t

          def state(t):
              t = t.replace('**Published release:** v1.1.2', '**Published release:** v1.2.0').replace('**Selected next release:** v1.2.0', '**Current development line:** post-v1.2.0').replace('**Validated packaged candidate:** v1.2.0-rc.5', '**Shipped release lineage:** v1.2.0 promoted from v1.2.0-rc.5').replace('**Candidate commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '**Release commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`')
              t = t.replace('## Published product: v1.1.2', '## Published product: v1.2.0').replace('## v1.2.0 candidate', '## v1.2.0 shipped capabilities').replace('## Validated packaged candidate: v1.2.0-rc.5', '## Shipped v1.2.0 release evidence')
              t = t.replace('`v1.2.0-rc.5` → `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '`v1.2.0` → `71f9b790a1f456321aee2c783f39f4a6784b83a9` (promoted byte-for-byte from `v1.2.0-rc.5`)')
              t = re.sub(r'## Remaining stable-release gates\n\n.*?## Current sources of truth', '## Post-release distribution-trust follow-up\n\nStable v1.2.0 publication is complete. Real Azure Artifact Signing and Apple Developer ID/notarization clean-machine evidence remain tracked under #125/#130 for a signed follow-up release. v1.2.0 artifacts are immutable and will not be replaced in place.\n\n## Current sources of truth', t, flags=re.S)
              return t

          def readiness(t):
              t = t.replace('The current published stable release is **v1.1.2**. The current validated packaged candidate is **v1.2.0-rc.5**. It must not be represented as the stable shipped release until the remaining public-trust gates complete.', 'The current published stable release is **v1.2.0**, promoted from validated `v1.2.0-rc.5` at `71f9b790a1f456321aee2c783f39f4a6784b83a9`. v1.2.0 is an explicit owner-approved unsigned/unnotarized exception; future normal stable releases remain subject to platform-signing gates by default.')
              t = re.sub(r'## Current v1\.2\.0 release-readiness status\n\n.*\Z', '## Current v1.2.0 release-readiness status\n\n**Published:** `v1.2.0` → `71f9b790a1f456321aee2c783f39f4a6784b83a9` on 2026-10-05.\n\nThe release is non-prerelease and GitHub\'s current latest release. Its Windows/macOS assets are byte-identical to the validated rc.5 packages and include packaged smoke, trust-state, checksum, and release-manifest evidence. v1.2.0 was published under an explicit owner-approved unsigned/unnotarized exception. Signed distribution remains post-release work under #125/#130 and must ship as a new release rather than mutating v1.2.0.\n', t, flags=re.S)
              return t

          def evidence(t):
              t = t.replace('**Status:** packaged prerelease candidate validated; signed public trust evidence pending', '**Status:** stable v1.2.0 published; signed platform-trust follow-up pending').replace('**Validated packaged candidate:** v1.2.0-rc.5', '**Published release:** v1.2.0 (promoted from v1.2.0-rc.5)').replace('**Candidate commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`', '**Release commit:** `71f9b790a1f456321aee2c783f39f4a6784b83a9`')
              t = re.sub(r'## Publication boundary\n\nUntil the stable trust gates complete:\n\n.*\Z', '## Publication boundary\n\nv1.2.0 is the latest stable shipped release and GitHub\'s current latest release. It is byte-identical to rc.5 and intentionally unsigned/unnotarized under an explicit owner-approved exception. README download links point to v1.2.0. Signed platform-trust distribution remains a follow-up release rather than an in-place mutation of v1.2.0.\n', t, flags=re.S)
              return t

          edit('README.md', readme)
          edit('CHANGELOG.md', changelog)
          edit('docs/SYSTEM_STATE.md', state)
          edit('docs/RELEASE_READINESS.md', readiness)
          edit('docs/validation/RELEASE_CANDIDATE_V1.2.0.md', evidence)
          PY

      - name: Remove temporary release workflows and markers
        run: |
          rm -f .github/workflows/publish-v1.2.0-unsigned.yml
          rm -f .github/workflows/reconcile-v1.2.0-release.yml
          rm -f .github/workflows/reconcile-v1.2.0-release-comment.yml
          rm -f .release/publish-v1.2.0-unsigned
          rm -f .release/reconcile-v1.2.0

      - name: Validate and commit
        run: |
          set -euo pipefail
          grep -q 'stable%20release-v1.2.0' README.md
          grep -q 'Download Job Ranger v1.2.0 for Windows' README.md
          grep -q '^## v1.2.0 - 2026-10-05$' CHANGELOG.md
          grep -q 'Published release:\*\* v1.2.0' docs/SYSTEM_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: mark v1.2.0 shipped and open post-release line'
          git push origin HEAD:main
