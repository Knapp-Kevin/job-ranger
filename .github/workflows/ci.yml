name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block high-severity dependency vulnerabilities
        run: node scripts/audit-dependencies.mjs

      - name: Run explicit release-candidate unit suite
        if: startsWith(github.head_ref, 'release/')
        run: npm run test:unit

      - name: Typecheck, build, and smoke test
        run: npm run repo:health

      - name: Run Electron E2E for release-line pull requests
        if: startsWith(github.head_ref, 'release/')
        run: xvfb-run -a npm run test:e2e
