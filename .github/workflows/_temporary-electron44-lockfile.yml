name: Temporary Electron 44 lockfile validation

on:
  push:
    branches:
      - hygiene/electron44-node22

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: hygiene/electron44-node22

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Regenerate lockfile for supported runtime
        run: npm install --package-lock-only

      - name: Validate clean install
        run: npm ci

      - name: Verify high-severity audit is clear
        run: npm audit --audit-level=high

      - name: Typecheck, build, and smoke test
        run: npm run repo:health

      - name: Remove temporary workflow and commit generated lockfile
        shell: bash
        run: |
          rm .github/workflows/_temporary-electron44-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/_temporary-electron44-lockfile.yml
          git diff --cached --stat
          git commit -m "chore(deps): regenerate lockfile for Electron 44"
          git push origin HEAD:hygiene/electron44-node22
