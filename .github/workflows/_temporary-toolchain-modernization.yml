name: Temporary toolchain modernization validation

on:
  push:
    branches:
      - hygiene/toolchain-modernization-final

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: hygiene/toolchain-modernization-final

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Clean install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Repository health
        run: npm run repo:health

      - name: Electron E2E
        run: xvfb-run -a npm run test:e2e

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate lockfile for modernized toolchain"
          git push origin HEAD:hygiene/toolchain-modernization-final
