name: Temporary Electron 44 E2E validation

on:
  push:
    branches:
      - hygiene/electron44-node22

permissions:
  contents: write

jobs:
  electron-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: hygiene/electron44-node22

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Electron Playwright E2E
        run: xvfb-run -a npm run test:e2e

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary-electron44-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_temporary-electron44-e2e.yml
          git commit -m "chore: remove temporary Electron 44 E2E workflow"
          git push origin HEAD:hygiene/electron44-node22
