name: Create v1.2.0 RC3

# One-shot release-candidate bridge. Tags created with the workflow GITHUB_TOKEN
# do not trigger downstream workflows, so this job creates/validates the immutable
# tag and then explicitly dispatches the platform build exactly once per run.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/create-v1.2.0-rc1.yml

permissions:
  contents: write
  actions: write

jobs:
  create-and-build-rc:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v1.2.0-rc1'
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify immutable RC tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e25c61c0be21dd00bc80a0880d2a770660c283bd
          TAG: v1.2.0-rc.3
        run: |
          set -euo pipefail
          tag_json="${RUNNER_TEMP}/tag-ref.json"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >"$tag_json" 2>/dev/null; then
            existing="$(jq -r '.object.sha' "$tag_json")"
            if [[ "$existing" != "$TARGET_SHA" ]]; then
              echo "Refusing to move existing immutable tag $TAG from $existing to $TARGET_SHA" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$TARGET_SHA" >/dev/null
          fi

      - name: Dispatch immutable platform build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0-rc.3
        run: |
          set -euo pipefail
          gh workflow run release-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release/v1.2.0-rc1 \
            -f tag="$TAG" \
            -f platform=all
